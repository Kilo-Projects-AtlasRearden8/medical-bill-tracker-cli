[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-bill-tracker"
version = "1.0.0"
description = "Local-first CLI to track medical bills, EOBs, insurance payments, and due dates."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Asdale Dynamics, LLC"}]

[project.scripts]
medical-bill-tracker = "medical_bill_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["medical_bill_tracker*"]
